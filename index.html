<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA MIGA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/styles.css?v=9">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        @theme static {
            --color-fondo: #FAF9F5;
            --color-texto: #20201E;
            --color-acento: #8B3048;
            --color-secundario: #F0CC5E;

            --font-rotulo: "Bitter", Georgia, serif;
            --font-texto: "Work Sans", Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-fondo font-texto leading-relaxed text-texto antialiased">
    <header class="cabecera sticky top-0 z-20 h-24">
        <div class="mx-auto flex h-full max-w-5xl flex-col items-center justify-start gap-2 px-5 pb-1 pt-6">
            <a href="#inicio" aria-label="LA MIGA, inicio">
                <img src="media/LOGO-La_Miga-NEGRO.svg" alt="LA MIGA" width="366" height="71" class="block h-auto w-36">
            </a>
            <nav aria-label="Principal">
                <ul class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 font-rotulo text-xs font-normal">
                    <li><a href="#productos" class="block py-2 hover:text-acento focus:text-acento">Productos</a></li>
                    <li><a href="#preguntas" class="block py-2 hover:text-acento focus:text-acento">Preguntas frecuentes</a></li>
                    <li><a href="#visitanos" class="block py-2 hover:text-acento focus:text-acento">Visitanos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenido">
        <section id="inicio" class="fondo-inicio flex items-center justify-center bg-cover bg-center text-center">
            <div class="contenido-inicio mx-auto w-full max-w-5xl px-5">
                <h1 class="font-rotulo text-4xl font-medium text-fondo md:text-6xl">Holsdss</h1>
                <button type="button" class="mt-8 bg-secundario px-6 py-3 font-texto font-semibold text-texto dark:text-fondo">
                    Échale un vistazo a nuestros productos
                </button>
            </div>
        </section>

        <div class="mx-auto min-h-screen max-w-5xl px-5">
            <section id="productos">
            </section>

            <section id="preguntas">
            </section>

            <section id="visitanos">
            </section>
        </div>
    </main>

    <footer class="mx-auto max-w-5xl px-5">
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="JS/script.js?v=4"></script>
</body>
</html>
